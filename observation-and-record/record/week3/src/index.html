<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Student Marks Manager</h1>

        <div class="input-section">

            <input
                type="text"
                id="nameInput"
                placeholder="Enter student name"
            >

            <input
                type="number"
                id="marksInput"
                placeholder="Enter marks"
                min="0"
                max="100"
            >

            <button id="addBtn">
                Add Student
            </button>

        </div>


        <h2>Student List</h2>

        <div id="studentList"></div>


        <div class="statistics">

            <h2>Statistics</h2>

            <p id="totalStudents">
                Total Students: 0
            </p>

            <p id="averageMarks">
                Average Marks: 0
            </p>

            <p id="highestMarks">
                Highest Marks: 0
            </p>

            <p id="lowestMarks">
                Lowest Marks: 0
            </p>

        </div>


        <div class="passed-section">

            <h2>Passed Students</h2>

            <div id="passedStudents">
                No students available.
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
