<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="heading">Document Object Model</h1>

        <p id="description">
            JavaScript can dynamically modify HTML content, styles and attributes using the DOM.
        </p>

        <div class="card" id="contentCard">
            <h2 id="cardTitle">DOM Interactive Example</h2>
            <p id="message">Click the buttons to see DOM changes.</p>
            <img id="sampleImage" src="https://picsum.photos/300/180" alt="Sample image">
        </div>

        <div class="buttons">
            <button id="contentBtn">Change Content</button>
            <button id="styleBtn">Change Style</button>
            <button id="attributeBtn">Change Attribute</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
