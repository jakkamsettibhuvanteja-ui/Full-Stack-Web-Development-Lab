<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Product Calculator</h1>

        <div class="form-group">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name">
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" placeholder="Enter quantity">
        </div>

        <div class="form-group">
            <label for="price">Price per Unit</label>
            <input type="number" id="price" min="0" step="0.01" placeholder="Enter price">
        </div>

        <button id="calculateBtn">Calculate Total</button>

        <p id="errorMessage"></p>

        <div class="result">
            <h2>Order Summary</h2>
            <p>Product: <span id="displayProduct">-</span></p>
            <p>Quantity: <span id="displayQuantity">-</span></p>
            <p>Price per Unit: ₹<span id="displayPrice">0.00</span></p>
            <p class="total">Total Price: ₹<span id="displayTotal">0.00</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
